<h1>If else conditions in Angular</h1>
<button (click)="show()">show</button>
<button (click)="hide()">hide</button>
<button (click)="toggle()">Toggle</button>

@if(display){
  <div style="width: 100px; height: 100px; background-color: blueviolet;">

  </div>
}
<hr>

<button (click)="toggle2()">{{display2?'Show yellow color':'Show red color'}}</button>
@if(display2){
  <div style="width: 100px; height: 100px; background-color: red;">

  </div>
}
@else{
  <div style="width: 100px; height: 100px; background-color: yellow;">

  </div>
}
