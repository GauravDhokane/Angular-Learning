<h1>If else conditions in Angular</h1>
<button (click)="handlecolor(1)">red</button>
<button (click)="handlecolor(2)">blue</button>
<button (click)="handlecolor(3)">yellow</button>
<button (click)="handlecolor(10)">other</button>

@if(display==1){
  <div style="width: 100px; height: 100px; background-color: red;">

  </div>
}
@else if(display==2){
  <div style="width: 100px; height: 100px; background-color: blue;">

  </div>
}
@else if(display==3){
  <div style="width: 100px; height: 100px; background-color: yellow;">

  </div>
}
@else{
  <div style="width: 100px; height: 100px; background-color: cyan;">

  </div>
}
<hr>
