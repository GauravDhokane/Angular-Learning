<h1>To Do List!!</h1>
<input type="text" [(ngModel)]="task" placeholder="Enter your task">
<button (click)="addTask()">Add task</button>

@for(tsk of tasklist;track tsk.id)
{
  <ul class="task-lst">
    <li>{{tsk.id}}</li>
    <li>{{tsk.task}}</li>
    <li><button (click)="deletetask(tsk.id)">Delete</button></li>

  </ul>
}
