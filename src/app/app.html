<h1>for loop in angular</h1>

@for(user of users; track user){
  <h2>{{user}}</h2>
}
<hr>

@for(std of students;track std.name; let id=$index){
    <span>{{id}}</span>
    <h2>
      <span>{{std.name}}</span>
      <span>{{std.age}}</span>
      <span>{{std.email}}</span>
      <button (click)="GetName(std.name)">GetName</button>
    </h2>
}
