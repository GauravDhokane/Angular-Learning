<h1>ngIf  directives </h1>
<h2 *ngIf="show">heading</h2>

<div *ngIf="login; else elseBlock">
  <a href="/">Login</a>
</div>
<ng-template #elseBlock>
  <a href="/">LogOut</a>
</ng-template>
<br>
<br>
<button (click)="Incre()">Increment</button>
<div *ngIf="val==0;else elseBlock2">
  <h3>heading 0</h3>
</div>
<ng-template #elseBlock2>
  <h3>heading {{val}}</h3>
</ng-template>
