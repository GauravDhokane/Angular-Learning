<h1>Diff types of Events</h1>
<button class="btn" name="login" (click)="handleeventfunccall($event)">click me!!</button>
<br>
<br>

<div
(mouseenter)="handleeventfunccall($event)"
style="background-color: green;width: 100px;height: 100px;">

</div>

<div
(mouseleave)="handleeventfunccall($event)"
style="background-color: red;width: 100px;height: 100px;">

</div>

<br>
<br>
<input type="text" name="Enter anything"
  (input)="handleeventfunccall($event)"
  (blur)="handleeventfunccall($event)"
  (focus)="handleeventfunccall($event)">
