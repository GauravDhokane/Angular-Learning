<h1>Get and Set input field value</h1>
<h2>user name is:{{displayname}}</h2>
<input type="text" value="{{name}}" placeholder="Enter value" (input)="getName($event)">
<br>
<br>
<button (click)="showName()">Get Value</button>
<button (click)="setName()">Set Value</button>

<br>
<br>
<h2>Email is:{{displayemail}}</h2>
<input type="text" value="{{email}}" placeholder="Enter email" (input)="getEmail($event)">
<br>
<br>
<button (click)="showEmail()">Get Email</button>
<button (click)="setEmail()">Set Email</button>
